import io.papermc.paperweight.userdev.ReobfArtifactConfiguration

plugins {
    id 'java'
    id("io.papermc.paperweight.userdev") version "2.0.0-beta.18"
    id("java-library")
    id("maven-publish")
}

group = 'net.dogemines'
version = '1.0-SNAPSHOT'
ext.artifactId = 'framework'

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from(components.java)
            groupId = project.group
            artifactId = project.artifactId
            version = project.version
        }
    }

    repositories {
        mavenLocal()
    }
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    //compileOnly("io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT")
    paperweight.paperDevBundle("1.21.8-R0.1-SNAPSHOT")
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.assemble {
    paperweight.reobfArtifactConfiguration = ReobfArtifactConfiguration.getMOJANG_PRODUCTION()
}

tasks.register("copyJar") {
    doLast {
        def targetDir = System.getenv('OUTPUT')
        if (!targetDir) {
            throw new GradleException("Environment variable OUTPUT is not set")
        }

        def target = file(targetDir)

        copy {
            from(tasks.jar)
            into(target)
        }
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
